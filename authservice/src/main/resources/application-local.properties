# Kafka Configuration
spring.kafka.bootstrap-servers=${spring.kafka.bootstrap-servers:kafka:9092}
spring.kafka.consumer.group-id=authservice-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Frontend URL for email links
app.frontend.url=${app.frontend.url:http://localhost:3000}

# Remove email configuration as it's now handled by email-service

# Admin credentials (can be overridden by environment variables)
app.admin.email=${APP_ADMIN_EMAIL:admin@travelmate.com}
app.admin.password=${APP_ADMIN_PASSWORD:Travelmate123}

# JWT configuration
app.jwt.secret=${app.jwt.secret}
app.jwt.refresh-secret=${app.jwt.refresh-secret}
app.jwt.expiration=${app.jwt.expiration:900000}
app.jwt.refresh-expiration=${app.jwt.refresh-expiration:604800000}

# Required: auto-generate DB schema
spring.jpa.hibernate.ddl-auto=update

# Optional: Show SQL in logs for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Eureka Client Configuration
eureka.client.service.url.defaultZone
eureka.client.service-url.defaultZone=${eureka.client.service.url.defaultZone:http://eureka-server:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

server.port=8083

# Zipkin tracing configuration for Docker
management.tracing.enabled=true
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

swagger.username=swagger
swagger.password=swagger
