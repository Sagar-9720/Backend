# Application Name
spring.application.name=auth-service

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travelmate_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:traveluser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${SERVER_PORT:8083}

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:Z3VhcmRpYW5fYXV0aF9zZXJ2aWNlX3NlY3JldF9rZXlfbW9yZV9zZWN1cmVfdGhhbl9iZWZvcmU=}
app.jwt.refresh-secret=${APP_JWT_REFRESH_SECRET:cmVmcmVzaF9zZWNyZXRfa2V5X3N1cGVyX3NlY3VyZV9hdXRoX3NlcnZpY2U=}
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# Logging
logging.level.com.travelmate.authservice=DEBUG
logging.level.org.springframework.security=DEBUG
