# Local profile for Gateway
spring:
  profiles:
    active: local
  config:
    activate:
      on-profile: local
  application:
    name: gateway
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
  kafka:
    bootstrap-servers: localhost:9092
  zipkin:
    base-url: http://localhost:9411
  redis:
    host: localhost
    port: 6379
    password: redispass
  prometheus:
    url: http://localhost:9090
  grafana:
    url: http://localhost:3000

