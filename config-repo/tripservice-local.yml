# Local profile for TripService
spring:
  profiles:
    active: local
  config:
    activate:
      on-profile: local
  application:
    name: tripservice
  datasource:
    url: jdbc:postgresql://localhost:5432/trip_service_db
    username: traveluser
    password: postgres
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
  kafka:
    bootstrap-servers: localhost:9092
  zipkin:
    base-url: http://localhost:9411
  redis:
    host: localhost
    port: 6379
    password: redispass
  prometheus:
    url: http://localhost:9090
  grafana:
    url: http://localhost:3000

