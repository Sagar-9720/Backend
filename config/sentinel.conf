port 26379

# Use hostname instead of IP
sentinel monitor mymaster redis-master 6379 2
sentinel auth-pass mymaster redispass
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 60000

# Enable hostname resolution so Sentinel can persist hostname
sentinel resolve-hostnames yes

# Prevent CONFIG REWRITE from replacing hostnames with IPs
sentinel announce-hostnames yes

# Generated by CONFIG REWRITE
latency-tracking-info-percentiles 50 99 99.9
dir "/data"
# user default on nopass sanitize-payload ~* &* +@all

# Sentinel ID (unique to this Sentinel)
# sentinel myid 3e0e5412a85f4cd959e6dd18e9eed5a54ff504aa
# sentinel config-epoch mymaster 0
# sentinel leader-epoch mymaster 0
# sentinel current-epoch 0
#
# # Keep known replicas with hostnames
# sentinel known-replica mymaster 172.18.0.13 6379
# sentinel known-replica mymaster 172.18.0.14 6379

loglevel warning
user default on nopass sanitize-payload ~* &* +@all
sentinel myid fb9205d1ae0807324ddab78d68698b5a975a3715
sentinel config-epoch mymaster 0
sentinel leader-epoch mymaster 0
sentinel current-epoch 0

sentinel known-replica mymaster 172.18.0.14 6379

sentinel known-sentinel mymaster 172.18.0.13 26379 e54020e8b7ab7e0042d23b6bb4aecd697087dd27

sentinel known-replica mymaster 172.18.0.11 6379

