version: '3.8'

services:
  # Service Discovery
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - travel-mate-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Databases
  postgres-trip:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trip_service_db
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_trip_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - travel-mate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveluser -d trip_service_db"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: travelmate_auth
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - travel-mate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveluser -d travelmate_auth"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-user:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - travel-mate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveluser -d user_service_db"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:6
    container_name: travelmate-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - travel-mate-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Microservices
  auth-service:
    build: ./authservice
    depends_on:
      postgres-auth:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/travelmate_auth
      SPRING_DATASOURCE_USERNAME: traveluser
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: auth-service
    networks:
      - travel-mate-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  user-service:
    build: ./user-service
    depends_on:
      postgres-user:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PG_HOST: postgres-user
      PG_PORT: 5432
      PG_USER: traveluser
      PG_PASSWORD: postgres
      PG_DATABASE: user_service_db
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_URI: mongodb://mongo:27017/user_service
      NODE_ENV: production
      PORT: 5000
      EUREKA_INSTANCE_HOSTNAME: user-service
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_SERVER_PORT: 8761
    networks:
      - travel-mate-network
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  trip-service:
    build: ./tripservice
    depends_on:
      postgres-trip:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-trip:5432/trip_service_db
      SPRING_DATASOURCE_USERNAME: traveluser
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: trip-service
      APP_USER_SERVICE_BASE_URL: http://gateway:8080
      SPRING_DATA_MONGODB_URI: mongodb://admin:password@mongo:27017/tripdb?authSource=admin
    networks:
      - travel-mate-network
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  gateway:
    build: ./gateway
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: gateway
    networks:
      - travel-mate-network
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Load Balancer (nginx)
  nginx:
    image: nginx:alpine
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - travel-mate-network

networks:
  travel-mate-network:
    driver: bridge

volumes:
  postgres_trip_data:
  postgres_auth_data:
  postgres_user_data:
  mongo_data:
