services:

  # Databases
  postgres-trip:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trip_service_db
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_trip_data:/var/lib/postgresql/data
      - ./scripts/init-trip-database.sql:/docker-entrypoint-initdb.d/init-trip-database.sql
    networks:
      - backend_travel-mate-network
    depends_on:
      - postgres-auth
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traveluser -d trip_service_db" ]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: travelmate_auth
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./scripts/init-auth-database.sql:/docker-entrypoint-initdb.d/init-auth-database.sql
    networks:
      - backend_travel-mate-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traveluser -d travelmate_auth" ]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-user:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
      - ./scripts/init-user-database.sql:/docker-entrypoint-initdb.d/init-user-database.sql
    networks:
      - backend_travel-mate-network
    depends_on:
      - postgres-trip
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traveluser -d user_service_db" ]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-journal:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: journal_service_db
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_journal_data:/var/lib/postgresql/data
      - ./scripts/init-journal-database.sql:/docker-entrypoint-initdb.d/init-journal-database.sql
    networks:
      - backend_travel-mate-network
    depends_on:
      - postgres-trip
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traveluser -d journal_service_db" ]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:6
    container_name: travelmate-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend_travel-mate-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 5s
      retries: 3


  # Service Discovery
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - backend_travel-mate-network
    environment:
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Microservices

  config-server:
    build: ./config-server
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8888:8888"
    networks:
      - backend_travel-mate-network
    environment:
      - SPRING_PROFILES_ACTIVE=git
      - GIT_TOKEN=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
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  auth-service:
    build: ./authservice
    depends_on:
      config-server:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
      # Only add secrets or profile-specific variables if needed, e.g. for prod:
      # DB_URL: ...
    networks:
      - backend_travel-mate-network
    ports:
      - "8083:8083"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  user-service:
    build: ./user-service
    depends_on:
      config-server:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      DEBUG: express:router
      # Only add secrets or profile-specific variables if needed, e.g. for prod:
      # DB_URL: ...
      CONFIG_SERVER_PROFILE: docker
    networks:
      - backend_travel-mate-network
    deploy:
      replicas: 1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  trip-service:
    build: ./tripservice
    depends_on:
      config-server:
        condition: service_healthy
      postgres-trip:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
      # Only add secrets or profile-specific variables if needed, e.g. for prod:
      # DB_URL: ...
    networks:
      - backend_travel-mate-network
    deploy:
      replicas: 1
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  journal-service:
    build: ./journalservice
    depends_on:
      config-server:
        condition: service_healthy
      postgres-trip:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
      # Only add secrets or profile-specific variables if needed, e.g. for prod:
      # DB_URL: ...
    networks:
      - backend_travel-mate-network
    deploy:
      replicas: 1
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  gateway:
    build: ./gateway
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
      # Only add secrets or profile-specific variables if needed, e.g. for prod:
    networks:
      - backend_travel-mate-network
    deploy:
      replicas: 1
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Load Balancer (nginx)
  nginx:
    image: nginx:alpine
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - backend_travel-mate-network

  zipkin:
    image: openzipkin/zipkin:2.24
    ports:
      - "9411:9411"
    networks:
      - backend_travel-mate-network

  # Redis and Sentinel Setup
  redis-master:
    image: redis:7
    container_name: redis-master
    ports:
      - 6379:6379
    volumes:
      - ./config/redis.conf:/etc/redis/redis.conf
      - redis-master-data:/data
    command: redis-server /etc/redis/redis.conf --appendonly yes --loglevel debug
    networks:
      - backend_travel-mate-network

  redis-replica-1:
    image: redis:7
    container_name: redis-replica-1
    depends_on:
      - redis-master
    volumes:
      - ./config/replica.conf:/etc/redis/replica.conf
      - redis-replica-1-data:/data
    command: redis-server /etc/redis/replica.conf --loglevel debug
    networks:
      - backend_travel-mate-network

  redis-replica-2:
    image: redis:7
    container_name: redis-replica-2
    depends_on:
      - redis-master
    volumes:
      - ./config/replica.conf:/etc/redis/replica.conf
      - redis-replica-2-data:/data
    command: redis-server /etc/redis/replica.conf --loglevel warning
    networks:
      - backend_travel-mate-network

  redis-sentinel-1:
    image: redis:7
    container_name: redis-sentinel-1
    depends_on:
      - redis-master
    ports:
      - 26379:26379
    volumes:
      - ./config:/etc/redis
      - redis-sentinel-1-data:/data
    command: sh -c "cp /etc/redis/sentinel.conf /data/sentinel.conf && redis-sentinel /data/sentinel.conf --loglevel debug"
    networks:
      - backend_travel-mate-network

  redis-sentinel-2:
    image: redis:7
    container_name: redis-sentinel-2
    depends_on:
      - redis-master
    ports:
      - 26380:26379
    volumes:
      - ./config:/etc/redis
      - redis-sentinel-2-data:/data
    command: sh -c "cp /etc/redis/sentinel.conf /data/sentinel.conf && redis-sentinel /data/sentinel.conf --loglevel warning"
    networks:
      - backend_travel-mate-network

  redis-sentinel-3:
    image: redis:7
    container_name: redis-sentinel-3
    depends_on:
      - redis-master
    ports:
      - 26381:26379
    volumes:
      - ./config:/etc/redis
      - redis-sentinel-3-data:/data
    command: sh -c "cp /etc/redis/sentinel.conf /data/sentinel.conf && redis-sentinel /data/sentinel.conf --loglevel warning"
    networks:
      - backend_travel-mate-network

  # Monitoring Stack
  # prometheus:
  #   image: prom/prometheus:v2.45.0
  #   container_name: prometheus
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--web.console.libraries=/usr/share/prometheus/console_libraries'
  #     - '--web.console.templates=/usr/share/prometheus/consoles'
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - backend_travel-mate-network
  #   healthcheck:
  #     test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

  # grafana:
  #   image: grafana/grafana:10.0.0
  #   container_name: grafana
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #     - ./config/grafana/provisioning:/etc/grafana/provisioning
  #     - ./config/grafana/dashboards:/etc/grafana/dashboards
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #     - GF_LOG_LEVEL=WARN
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - backend_travel-mate-network
  #   depends_on:
  #     prometheus:
  #       condition: service_healthy
  #   healthcheck:
  #     test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

  # Message Broker
  zookeeper:
    image: bitnami/zookeeper:3.8
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_LOG_LEVEL: WARN
    networks:
      - backend_travel-mate-network

  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LOG_LEVEL: WARN
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - backend_travel-mate-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "echo ruok | nc zookeeper 2181 | grep imok" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Email Service
  email-service:
    build: ./emailservice
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
      - MAIL_USERNAME=your-email@gmail.com
      - MAIL_PASSWORD=your-app-specific-password
    networks:
      - backend_travel-mate-network
    ports:
      - "8085:8085"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - logger.level=WARN
    ports:
      - "9200:9200"
    networks:
      - backend_travel-mate-network
    deploy:
      resources:
        limits:
          memory: 1g

  # --- Manual Data Initialization Steps (run manually) ---

  init-authservice-users:
    image: postgres:15-alpine
    volumes:
      - ./scripts/init-authservice-users.sql:/tmp/init-authservice-users.sql
    environment:
      PGPASSWORD: postgres
    entrypoint: [ "sh", "-c", "psql -h postgres-auth -U traveluser -d travelmate_auth -f /tmp/init-authservice-users.sql" ]
    depends_on:
      - postgres-auth
      - auth-service
    networks:
      - backend_travel-mate-network

  init-tripservice-data:
    image: postgres:15-alpine
    volumes:
      - ./scripts/init-tripservice-data.sql:/tmp/init-tripservice-data.sql
    entrypoint: [ "sh", "-c", "psql -h postgres-trip -U traveluser -d trip_service_db -f /tmp/init-tripservice-data.sql" ]
    environment:
      PGPASSWORD: postgres
    depends_on:
      - postgres-trip
      - trip-service
    networks:
      - backend_travel-mate-network

  init-user-postgres-demo:
    image: postgres:15-alpine
    volumes:
      - ./scripts/init-user-postgres-demo.sql:/tmp/init-user-postgres-demo.sql
    entrypoint: [ "sh", "-c", "psql -h postgres-user -U traveluser -d user_service_db -f /tmp/init-user-postgres-demo.sql" ]
    environment:
      PGPASSWORD: postgres
    depends_on:
      - postgres-user
      - auth-service
      - init-authservice-users
      - init-tripservice-data
    networks:
      - backend_travel-mate-network

  init-journal-postgres-demo:
    image: postgres:15-alpine
    volumes:
      - ./scripts/init-journal-postgres-demo.sql:/tmp/init-journal-postgres-demo.sql
    entrypoint: [ "sh", "-c", "psql -h postgres-journal -U traveluser -d journal_service_db -f /tmp/init-journal-postgres-demo.sql" ]
    environment:
      PGPASSWORD: postgres
    depends_on:
      - postgres-user
      - auth-service
      - init-authservice-users
      - init-tripservice-data
    networks:
      - backend_travel-mate-network

  init-mongodb-user-service:
    image: mongo:6
    volumes:
      - ./scripts/init-mongodb-user-service.js:/tmp/init-mongodb-user-service.js
    entrypoint: [ "sh", "-c", "mongosh --host mongo -u admin -p password --authenticationDatabase admin /tmp/init-mongodb-user-service.js" ]
    depends_on:
      - mongo
      - postgres-auth
      - postgres-user
      - init-tripservice-data
      - init-authservice-users
    networks:
      - backend_travel-mate-network

  init-mongodb-journalservice:
    image: mongo:6
    volumes:
      - ./scripts/init-mongodb-journalservice.js:/tmp/init-mongodb-journal.js
    entrypoint: [ "sh", "-c", "mongosh --host mongo -u admin -p password --authenticationDatabase admin /tmp/init-mongodb-journal.js" ]
    depends_on:
      - mongo
      - postgres-trip
      - trip-service
      - journal-service
    networks:
      - backend_travel-mate-network

volumes:
  postgres_trip_data:
  postgres_auth_data:
  postgres_user_data:
  postgres_journal_data:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:

networks:
  backend_travel-mate-network:
    driver: bridge

# Note: Service-specific SQL (tables/data) should be run by each service on startup, not mounted here.
# MongoDB scripts should be run after all Postgres data is ready.
