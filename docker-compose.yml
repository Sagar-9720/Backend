services:
  # Service Discovery
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - backend_travel-mate-network
    environment:
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Databases
  postgres-trip:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trip_service_db
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_trip_data:/var/lib/postgresql/data
      - ./scripts/init-trip-database.sql:/docker-entrypoint-initdb.d/init-trip-database.sql
    networks:
      - backend_travel-mate-network
    depends_on:
      - postgres-auth
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traveluser -d trip_service_db" ]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: travelmate_auth
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./scripts/init-auth-database.sql:/docker-entrypoint-initdb.d/init-auth-database.sql
    networks:
      - backend_travel-mate-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traveluser -d travelmate_auth" ]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-user:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
      - ./scripts/init-user-database.sql:/docker-entrypoint-initdb.d/init-user-database.sql
    networks:
      - backend_travel-mate-network
    depends_on:
      - postgres-trip
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traveluser -d user_service_db" ]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:6
    container_name: travelmate-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-mongodb-user-service.js:/docker-entrypoint-initdb.d/01-init-mongodb-user-service.js
      - ./scripts/init-mongodb-tripservice.js:/docker-entrypoint-initdb.d/02-init-mongodb-tripservice.js
    networks:
      - backend_travel-mate-network
    depends_on:
      - postgres-auth
      - postgres-trip
      - postgres-user
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Microservices
  config-server:
    build: ./config-server
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8888:8888"
    networks:
      - backend_travel-mate-network
    environment:
      - SPRING_PROFILES_ACTIVE=git
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  auth-service:
    build: ./authservice
    depends_on:
      config-server:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
      # Only add secrets or profile-specific variables if needed, e.g. for prod:
      # DB_URL: ...
      # DB_USER: ...
      # DB_PASSWORD: ...
      # MAIL_USERNAME: ...
      # MAIL_PASSWORD: ...
      # etc.
    networks:
      - backend_travel-mate-network
    ports:
      - "8083:8083"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  user-service:
    build: ./user-service
    depends_on:
      config-server:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      DEBUG: express:router
      # Only add secrets or profile-specific variables if needed, e.g. for prod:
      # DB_URL: ...
      # DB_USER: ...
      # DB_PASSWORD: ...
      # MAIL_USERNAME: ...
      # MAIL_PASSWORD: ...
      # etc.
      CONFIG_SERVER_PROFILE: docker
    networks:
      - backend_travel-mate-network
    deploy:
      replicas: 2
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  trip-service:
    build: ./tripservice
    depends_on:
      config-server:
        condition: service_healthy
      postgres-trip:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
      # Only add secrets or profile-specific variables if needed, e.g. for prod:
      # DB_URL: ...
      # DB_USER: ...
      # DB_PASSWORD: ...
      # MAIL_USERNAME: ...
      # MAIL_PASSWORD: ...
      # etc.
    networks:
      - backend_travel-mate-network
    deploy:
      replicas: 2
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  gateway:
    build: ./gateway
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
      # Only add secrets or profile-specific variables if needed, e.g. for prod:
    networks:
      - backend_travel-mate-network
    deploy:
      replicas: 2
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Load Balancer (nginx)
  nginx:
    image: nginx:alpine
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - backend_travel-mate-network

  zipkin:
    image: openzipkin/zipkin:2.24
    ports:
      - "9411:9411"
    networks:
      - backend_travel-mate-network

  # Redis and Sentinel Setup
  redis-master:
    image: redis:7
    container_name: redis-master
    ports:
      - 6379:6379
    command: redis-server --requirepass redispass --appendonly yes
    networks:
      - backend_travel-mate-network

  redis-replica-1:
    image: redis:7
    container_name: redis-replica-1
    depends_on:
      - redis-master
    command: >
      sh -c "redis-server --replicaof redis-master 6379 --masterauth redispass --requirepass redispass"
    networks:
      - backend_travel-mate-network

  redis-replica-2:
    image: redis:7
    container_name: redis-replica-2
    depends_on:
      - redis-master
    command: >
      sh -c "redis-server --replicaof redis-master 6379 --masterauth redispass --requirepass redispass"
    networks:
      - backend_travel-mate-network

  redis-sentinel-1:
    image: redis:7
    container_name: redis-sentinel-1
    depends_on:
      - redis-master
    ports:
      - 26379:26379
    volumes:
      - ./config:/etc/redis
    command: redis-sentinel /etc/redis/sentinel.conf
    networks:
      - backend_travel-mate-network

  redis-sentinel-2:
    image: redis:7
    container_name: redis-sentinel-2
    depends_on:
      - redis-master
    ports:
      - 26380:26379
    volumes:
      - ./config:/etc/redis
    command: redis-sentinel /etc/redis/sentinel.conf
    networks:
      - backend_travel-mate-network

  redis-sentinel-3:
    image: redis:7
    container_name: redis-sentinel-3
    depends_on:
      - redis-master
    ports:
      - 26381:26379
    volumes:
      - ./config:/etc/redis
    command: redis-sentinel /etc/redis/sentinel.conf
    networks:
      - backend_travel-mate-network

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - backend_travel-mate-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - backend_travel-mate-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Message Broker
  zookeeper:
    image: bitnami/zookeeper:3.8
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - backend_travel-mate-network

  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - backend_travel-mate-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "echo ruok | nc zookeeper 2181 | grep imok" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Email Service
  email-service:
    build: ./emailservice
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG=WARN
      - MAIL_USERNAME=your-email@gmail.com
      - MAIL_PASSWORD=your-app-specific-password
    networks:
      - backend_travel-mate-network
    ports:
      - "8085:8085"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - backend_travel-mate-network

volumes:
  postgres_trip_data:
  postgres_auth_data:
  postgres_user_data:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  backend_travel-mate-network:
    driver: bridge

# Note: Service-specific SQL (tables/data) should be run by each service on startup, not mounted here.
# MongoDB scripts should be run after all Postgres data is ready.
