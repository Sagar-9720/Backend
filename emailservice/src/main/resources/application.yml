server:
  port: 8085

spring:
  application:
    name: emailservice
  config:
    import: "configserver:"
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: true
    bus:
      enabled: true
      id: ${spring.application.name}
    stream:
      kafka:
        binder:
          brokers: kafka:9092
          auto-create-topics: true
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: ${spring.application.name}
        springCloudBusOutput:
          destination: springCloudBus
  kafka:
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.travelmate.emailservice.dto
        spring.json.value.default.type: com.travelmate.emailservice.dto.EmailRequest
        spring.json.use.type.headers: false
management:
  endpoints:
    web:
      exposure:
        include: busrefresh,refresh,health,info