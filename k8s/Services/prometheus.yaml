apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: travelmate
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: travelmate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: travelmate
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'spring-boot-services'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['auth-service:8083', 'trip-service:8082', 'gateway:8080', 'email-service:8085']
      - job_name: 'elasticsearch'
        static_configs:
          - targets: ['elasticsearch:9200']
      - job_name: 'mongo'
        static_configs:
          - targets: ['mongo:27017']
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-master:6379']
      - job_name: 'kafka'
        static_configs:
          - targets: ['kafka:9092']
      - job_name: 'zipkin'
        static_configs:
          - targets: ['zipkin:9411']

