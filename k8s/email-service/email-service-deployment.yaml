apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: travelmate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
        - name: email-service
          image: backend-email-service:latest
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: email-service-config
            - secretRef:
                name: email-service-secret
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
