apiVersion: batch/v1
kind: Job
metadata:
  name: init-mongodb-tripservice
  namespace: travelmate
spec:
  template:
    spec:
      containers:
      - name: init-mongodb-tripservice
        image: mongo:6
        command: ["sh", "-c"]
        args:
          - |
            mongosh --host mongo -u admin -p password --authenticationDatabase admin /scripts/init-mongodb-tripservice.js
        volumeMounts:
          - name: init-scripts
            mountPath: /scripts
      restartPolicy: OnFailure
      volumes:
        - name: init-scripts
          configMap:
            name: init-mongodb-tripservice-js
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-mongodb-tripservice-js
  namespace: travelmate
data:
