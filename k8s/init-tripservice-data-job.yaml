apiVersion: batch/v1
kind: Job
metadata:
  name: init-tripservice-data
  namespace: travelmate
spec:
  template:
    spec:
      containers:
      - name: init-tripservice-data
        image: postgres:15-alpine
        env:
          - name: PGPASSWORD
            value: postgres
        command: ["sh", "-c"]
        args:
          - |
            psql -h postgres-trip -U traveluser -d trip_service_db -f /scripts/init-tripservice-data.sql
        volumeMounts:
          - name: init-scripts
            mountPath: /scripts
      restartPolicy: OnFailure
      volumes:
        - name: init-scripts
          configMap:
            name: init-tripservice-data-sql
---
