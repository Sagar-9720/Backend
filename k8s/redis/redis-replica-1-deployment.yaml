apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-replica-1
  namespace: travelmate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-replica-1
  template:
    metadata:
      labels:
        app: redis-replica-1
    spec:
      containers:
        - name: redis-replica-1
          image: redis:7
          ports:
            - containerPort: 6379
          command: ["sh", "-c"]
          args:
            - |
              redis-server --replicaof redis-master 6379 --masterauth $(REDIS_PASSWORD) --requirepass $(REDIS_PASSWORD) --loglevel warning
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD

