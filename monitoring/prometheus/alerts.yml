groups:
  - name: infra.rules
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "Target {{ $labels.job }}/{{ $labels.instance }} is not reachable."

      - alert: HighCPU
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "High CPU on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "High memory usage on {{ $labels.instance }} (>90%)"

      - alert: LowDiskSpace
        expr: 100 * (1 - node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Low disk space on {{ $labels.instance }} (<10% free)"

      - alert: HighContainerCPU
        expr: sum by (container_label_com_docker_swarm_task_name) (rate(container_cpu_usage_seconds_total[5m])) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Container high CPU"

      - alert: ExporterDown
        expr: up{job=~"redis|postgres|mongo|kafka|zookeeper|nginx"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Exporter {{ $labels.job }} down"
          description: "Exporter {{ $labels.job }} on {{ $labels.instance }} is not reachable."

      - alert: PostgresTooManyConnections
        expr: pg_stat_activity_count > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Postgres too many connections (>90)"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_config_maxmemory_bytes > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Redis memory usage > 90%"

  - name: app.rules
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) /
          sum by (job) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "High 5xx error rate ({{ $labels.job }})"

      - alert: SlowResponses
        expr: |
          (rate(http_server_requests_seconds_sum{status!~"5.."}[5m]) /
           rate(http_server_requests_seconds_count{status!~"5.."}[5m])) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "High avg response time > 500ms ({{ $labels.job }})"

      - alert: LowCacheHitRate
        expr: |
          sum(rate(spring_cache_gets_total{result="hit"}[5m])) /
          (sum(rate(spring_cache_gets_total{result="hit"}[5m])) + sum(rate(spring_cache_gets_total{result="miss"}[5m]))) < 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Cache hit rate below 80%"

