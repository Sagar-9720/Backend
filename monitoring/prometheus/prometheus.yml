global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot microservices with Actuator endpoints
  - job_name: "trip-service"
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["trip-service:8082"]
        labels:
          application: "trip-service"

  - job_name: "auth-service"
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["auth-service:8083"]
        labels:
          application: "auth-service"

  - job_name: "journal-service"
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["journal-service:8081"]
        labels:
          application: "journal-service"

  - job_name: "email-service"
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["email-service:8085"]
        labels:
          application: "email-service"

  - job_name: "gateway"
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          application: "gateway"

  - job_name: "config-server"
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["config-server:8888"]
        labels:
          application: "config-server"

  - job_name: "eureka-server"
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["eureka-server:8761"]
        labels:
          application: "eureka-server"

  # Node.js User Service
  - job_name: "user-service"
    scrape_interval: 5s
    static_configs:
      - targets: ["user-service:5000"]
        labels:
          application: "user-service"
          service_type: "node"
    metric_relabel_configs:
      # Keep and categorize Redis metrics
      - source_labels: [__name__]
        regex: 'userservice_redis_.*'
        target_label: metric_type
        replacement: "redis"
      # Keep and categorize Kafka metrics
      - source_labels: [__name__]
        regex: 'userservice_kafka_.*'
        target_label: metric_type
        replacement: "kafka"
      # Keep and categorize View metrics
      - source_labels: [__name__]
        regex: 'userservice_view_.*'
        target_label: metric_type
        replacement: "view"

  # Infrastructure monitoring
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Database monitoring
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          database: "postgres"
          instance: "trip_service_db"
  
  - job_name: "postgres-auth-exporter"
    static_configs:
      - targets: ["postgres-auth-exporter:9187"]
        labels:
          database: "postgres" 
          instance: "travelmate_auth"
  
  - job_name: "postgres-user-exporter"
    static_configs:
      - targets: ["postgres-user-exporter:9187"]
        labels:
          database: "postgres"
          instance: "user_service_db"
  
  - job_name: "postgres-journal-exporter"
    static_configs:
      - targets: ["postgres-journal-exporter:9187"]
        labels:
          database: "postgres"
          instance: "journal_service_db"

  - job_name: "mongodb-exporter"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          database: "mongodb"

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          database: "redis"
    metric_relabel_configs:
      # Add replica and sentinel labels based on instance info
      - source_labels: [__name__, addr]
        regex: '(redis_.*);(.*)'
        target_label: redis_instance
        replacement: '${2}'

  # Message broker monitoring
  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Web server monitoring
  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # API endpoint monitoring
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://gateway:8080/api/trip/trips
        - http://gateway:8080/api/auth/health
        - http://gateway:8080/api/users/health
        - http://gateway:8080/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
