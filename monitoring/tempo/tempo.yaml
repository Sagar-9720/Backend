server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    block:
      bloom_filter_false_positive: 0.05
    wal:
      path: /tempo-data/wal
    local:
      path: /tempo-data/blocks
    pool:
      max_workers: 100
      queue_depth: 10000

overrides:
  metrics_generator_processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
