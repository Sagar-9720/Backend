events {
    worker_connections 1024;
}

http {
    upstream gateway_backend {
        # Load balance between gateway instances
        server gateway:8080 max_fails=3 fail_timeout=30s;
        # Add more gateway instances if running with docker-compose scale
        # server gateway_2:8080 max_fails=3 fail_timeout=30s;
    }

    upstream user_service_backend {
        # Load balance between user-service instances  
        server user-service:5000 max_fails=3 fail_timeout=30s;
        # Add more user-service instances if needed
        # server user-service_2:5000 max_fails=3 fail_timeout=30s;
    }

    upstream trip_service_backend {
        # Load balance between trip-service instances
        server trip-service:8082 max_fails=3 fail_timeout=30s;
        # Add more trip-service instances if needed
        # server trip-service_2:8082 max_fails=3 fail_timeout=30s;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Apply rate limiting
        limit_req zone=api burst=20 nodelay;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Route to gateway (main entry point)
        location / {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Enable buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Direct access to user service (optional)
        location /direct/user/ {
            rewrite ^/direct/user/(.*) /$1 break;
            proxy_pass http://user_service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Direct access to trip service (optional)
        location /direct/trip/ {
            rewrite ^/direct/trip/(.*) /$1 break;
            proxy_pass http://trip_service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Eureka dashboard (for monitoring)
        location /eureka/ {
            proxy_pass http://eureka-server:8761/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server (optional, for production)
    # server {
    #     listen 443 ssl;
    #     server_name localhost;
    #     
    #     ssl_certificate /etc/nginx/ssl/server.crt;
    #     ssl_certificate_key /etc/nginx/ssl/server.key;
    #     
    #     location / {
    #         proxy_pass http://gateway_backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}
