spring:
  cache:
    type: redis
    redis:
      time-to-live: 300000
      enable-statistics: true
  data:
    redis:
      timeout: 2000
      database: 0
      sentinel:
        master: mymaster
        nodes: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      password: redispass
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  application:
    name: tripservice

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,caches
  metrics:
    cache:
      enabled: true
    distribution:
      percentiles-histogram:
        cache: true
      sla:
        cache: 50ms,100ms,200ms
  tracing:
    zipkin:
      base-url: http://zipkin:9411

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka-server:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
      prefer-ip-address: true
