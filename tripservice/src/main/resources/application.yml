spring:
  cache:
    type: redis
    redis:
      time-to-live: 300000
      enable-statistics: true
  redis:
    host: localhost
    port: 6379
    timeout: 2000
    database: 0
    sentinel:
      master: mymaster
      nodes: ${REDIS_SENTINEL_NODES:localhost:26379,localhost:26380,localhost:26381}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: -1ms
  application:
    name: tripservice

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,caches
  metrics:
    cache:
      enabled: true
    distribution:
      percentiles-histogram:
        cache: true
      sla:
        cache: 50ms,100ms,200ms
